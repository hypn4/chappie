name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
      dry_run:
        description: Validate without publishing to npm
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  npm:
    if: github.repository == 'hypn4/chappie' && (vars.NPM_TRUSTED_PUBLISHING == 'true' || inputs.dry_run == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release identity
        id: metadata
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          bun scripts/release-metadata.mjs "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          npm_version="$(npm --version)"
          npm_core="${npm_version%%[-+]*}"
          npm_major="${npm_core%%.*}"
          npm_rest="${npm_core#*.}"
          npm_minor="${npm_rest%%.*}"
          npm_patch="${npm_rest#*.}"
          test "$npm_major" -gt 11 || {
            test "$npm_major" -eq 11 &&
            { test "$npm_minor" -gt 5 || { test "$npm_minor" -eq 5 && test "$npm_patch" -ge 1; }; }
          }
      - name: Recover the immutable verified artifact
        env:
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$RELEASE_COMMIT&status=success&per_page=20" --jq '.workflow_runs | sort_by(.created_at) | last | .id')"
          test -n "$run_id"
          test "$run_id" != null
          mkdir verified release
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n npm-package -D verified
          gh release download "$RELEASE_TAG" -p package.tgz -D release
          cmp verified/package.tgz release/package.tgz
          cp verified/package.tgz package.tgz
      - run: bun scripts/verify-package.mjs package.tgz
      - name: Dry run
        if: inputs.dry_run == true
        env:
          DIST_TAG: ${{ steps.metadata.outputs.distTag }}
        run: npm publish ./package.tgz --ignore-scripts --access public --tag "$DIST_TAG" --dry-run
      - name: Publish release artifact with npm OIDC
        if: inputs.dry_run != true
        env:
          DIST_TAG: ${{ steps.metadata.outputs.distTag }}
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          npm publish ./package.tgz --ignore-scripts --access public --tag "$DIST_TAG"
