name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    outputs:
      integrity:
        description: SHA-512 integrity of the tested npm artifact
        value: ${{ jobs.package.outputs.integrity }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: false
          install: false
          cache: false
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      integrity: ${{ steps.inspect.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: false
          install: false
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack --out package.tgz
      - id: inspect
        run: node scripts/verify-package.mjs package.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Show consumer runtime
        run: |
          node --version
          npm --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - name: Inspect artifact and prepare consumer
        run: node scripts/verify-package.mjs package.tgz --prepare "${{ runner.temp }}/chappie-consumer"
      - name: Install the package as a consumer
        working-directory: ${{ runner.temp }}/chappie-consumer
        timeout-minutes: 5
        run: >-
          npm install "${{ github.workspace }}/package.tgz"
          --ignore-scripts --omit=dev --no-audit --no-fund
          --timing --loglevel=verbose
          --cache "${{ runner.temp }}/chappie-npm-cache"
      - name: Verify installed broker and runtime assets
        run: node scripts/verify-package.mjs package.tgz --installed "${{ runner.temp }}/chappie-consumer"
      - name: Retain npm diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/chappie-npm-cache/_logs/
          if-no-files-found: ignore
          retention-days: 7
