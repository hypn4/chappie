name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    outputs:
      integrity:
        description: SHA-512 integrity of the tested npm artifact
        value: ${{ jobs.package.outputs.integrity }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run check
      - run: bun run test:omp
      - run: bun run test:otunnel

  omp-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - name: Verify the declared OMP 18.3 floor
        run: >-
          bun add --dev --exact --no-save
          @oh-my-pi/pi-ai@18.3.0
          @oh-my-pi/pi-coding-agent@18.3.0
          @oh-my-pi/pi-utils@18.3.0
      - run: bun run test:omp

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      integrity: ${{ steps.inspect.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run build
      - run: bun pm pack --ignore-scripts --filename package.tgz
      - id: inspect
        run: bun scripts/verify-package.mjs package.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - name: Prepare isolated consumer
        run: bun scripts/verify-package.mjs package.tgz --prepare "${{ runner.temp }}/chappie-consumer"
      - name: Install the tested artifact with Bun
        working-directory: ${{ runner.temp }}/chappie-consumer
        timeout-minutes: 5
        run: bun add --ignore-scripts "${{ github.workspace }}/package.tgz"
      - name: Install pinned OMP runtime for package integration
        working-directory: ${{ runner.temp }}/chappie-consumer
        run: bun add --ignore-scripts @oh-my-pi/pi-coding-agent@18.4.4
      - name: Verify installed broker and packaged OMP runtime
        run: >-
          bun scripts/verify-package.mjs package.tgz
          --installed "${{ runner.temp }}/chappie-consumer"
          --omp
