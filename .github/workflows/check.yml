name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    outputs:
      integrity:
        description: SHA-512 integrity of the tested npm artifact
        value: ${{ jobs.package.outputs.integrity }}

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run check
      - if: matrix.os == 'windows-latest'
        run: bun run test:omp

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun audit --audit-level=high
      - name: Verify the declared OMP 18.3 floor
        run: >-
          bun add --dev --exact --no-save
          @oh-my-pi/pi-ai@18.3.0
          @oh-my-pi/pi-coding-agent@18.3.0
          @oh-my-pi/pi-utils@18.3.0
      - run: bun run test:omp
      - name: Download otunnel 0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R zetaloop/otunnel v0.2.0 -p otunnel-x86_64-unknown-linux-gnu-v0.2.0.tar.gz
      - name: Verify otunnel 0.2 runtime contract
        run: |
          echo "69f789fd8df156609ce26d2e004c5af80d6d9677df137220b25d48483174c415  otunnel-x86_64-unknown-linux-gnu-v0.2.0.tar.gz" | sha256sum -c -
          tar -xzf otunnel-x86_64-unknown-linux-gnu-v0.2.0.tar.gz otunnel
          chmod +x otunnel
          OTUNNEL="$PWD/otunnel" bun run test:otunnel

  package:
    needs: [source, compat]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      integrity: ${{ steps.inspect.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run build
      - run: bun pm pack --ignore-scripts --filename package.tgz
      - id: inspect
        run: bun scripts/verify-package.mjs package.tgz
      - name: Verify clean consumer
        run: |
          consumer="${{ runner.temp }}/chappie-consumer"
          bun scripts/verify-package.mjs package.tgz --prepare "$consumer"
          cd "$consumer"
          bun add --ignore-scripts "${{ github.workspace }}/package.tgz"
          bun add --ignore-scripts @oh-my-pi/pi-coding-agent@18.4.6
          cd "${{ github.workspace }}"
          bun scripts/verify-package.mjs package.tgz --installed "$consumer" --omp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
